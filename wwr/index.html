<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home white water rafting</title>
    <meta name="description"
      content="Experience the thrill of white-water rafting! Ride through rushing rapids, conquer exciting waves, and create unforgettable memories with friends and family. Adventure starts here.">
    <meta name="author" content="Ayomide Ayodeji">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="white water rafting logo" width="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero-home">
            <img src="images/rafting-drivers.jpg" alt="rafting drivers">
            <h1>White water rafting</h1>
        </div>
        <form class="newsletter">
            <h2>Join Our Newsletter</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Sign Up</button>
        </form>

        <a href="trips.html" class="cta-btn">Ready for adventure? Explore our trips!</a>

        <section class="offerings">
            <h2>Why Raft With Us</h2>
            <div class="grid-content">
                <div class="grid-item">
                    <img src="images/extreme-rapid.jpg" alt="expert guides">
                    <p>Experienced guides who know every rapid on the river.</p>
                </div>
                <div class="grid-item">
                    <img src="images/rafting.jpg" alt="safety gear">
                    <p>Top-tier safety equipment for every skill level.</p>
                </div>
            </div>
        </section>
    </main>


</body>

</html>
