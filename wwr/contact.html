<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us white water rafting</title>
    <meta name="description"
      content="This page provides the contact of the website, location for the company.">
    <meta name="author" content="Ayomide Ayodeji">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="white water rafting logo" width="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <main>
            <h1>Contact Us</h1>

            <section class="company-info">
                <h2>White Water Rafting Company</h2>
                <p>123 Main River Street<br>
                    Kolob, California</p>
                <p>Phone: +1 999 999 9999</p>
                <p>Email: info@whitewater.com</p>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </main>
    </main>
    <footer>
        <p>©2026 white water rafting Ayomide Ayodeji</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href=" https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href=" https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
