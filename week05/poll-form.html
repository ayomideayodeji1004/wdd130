<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form- User poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form- User poll</h1>
    </header>
    <main>
        <form>
            <fieldset class="contact-information">
                <legend>contact information</legend>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>


                <fieldset>
                    <legend>Questions</legend>

                    <label for="browser">What is your favorite internet browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                    </select>

                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">

                    <label for="places">List the places you have lived:</label>
                    <textarea id="places" name="places" rows="5"></textarea>

                    <button type="submit">Submit</button>
                </fieldset>

        </form>
    </main>
    <footer>
        <p>©2024 | HTML Form User Poll Activity Ayoomide ayodeji</p>
    </footer>
</body>

</html>
